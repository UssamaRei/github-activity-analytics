name: il05

x-hadoop-env: &hadoop-env
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  HDFS_CONF_dfs_replication: "1"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HADOOP_HEAPSIZE: "256"

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, github_events, --partitions, "1", --replication-factor, "1"]
    mem_limit: 384m

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    ports:
      - "127.0.0.1:${HDFS_UI_PORT:-9870}:9870"
    environment:
      <<: *hadoop-env
      CLUSTER_NAME: il05
      HDFS_CONF_dfs_namenode_safemode_threshold___pct: "0"
    volumes:
      - hdfs-name:/hadoop/dfs/name
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: namenode:9870
      HDFS_CONF_dfs_datanode_hostname: datanode
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hdfs-data:/hadoop/dfs/data
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment: *hadoop-env
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    command: [bash, /opt/project/storage/init_hdfs.sh]
    volumes:
      - ./storage:/opt/project/storage:ro
    mem_limit: 384m

  spark-cache-init:
    image: ${SPARK_IMAGE:-apache/spark:3.5.1}
    user: "0:0"
    entrypoint: [chown, "185:0", /tmp/ivy]
    volumes:
      - spark-ivy:/tmp/ivy
    mem_limit: 128m

  spark-bronze:
    image: ${SPARK_IMAGE:-apache/spark:3.5.1}
    user: "185:0"
    hostname: spark-bronze
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: github_events
      BRONZE_PATH: hdfs://namenode:9000/lake/bronze/github_events
      CHECKPOINT_PATH: hdfs://namenode:9000/checkpoints/github_events_bronze
      HADOOP_USER_NAME: github
      SPARK_LOCAL_IP: 0.0.0.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
      spark-cache-init:
        condition: service_completed_successfully
    entrypoint: [/opt/spark/bin/spark-submit]
    command:
      - --master
      - local[2]
      - --driver-memory
      - 768m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.jars.ivySettings=/opt/project/storage/ivysettings.xml
      - --conf
      - spark.driver.host=spark-bronze
      - --packages
      - ${SPARK_KAFKA_PACKAGE:-org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1}
      - /opt/project/storage/bronze_stream.py
    volumes:
      - ./storage:/opt/project/storage:ro
      - spark-ivy:/tmp/ivy
    mem_limit: 1536m
    stop_grace_period: 30s

  spark-silver:
    image: ${SPARK_IMAGE:-apache/spark:3.5.1}
    profiles: [silver]
    user: "185:0"
    hostname: spark-silver
    environment:
      BRONZE_PATH: hdfs://namenode:9000/lake/bronze/github_events
      SILVER_PATH: hdfs://namenode:9000/lake/silver/github_events
      QUARANTINE_PATH: hdfs://namenode:9000/lake/quarantine/github_events
      HADOOP_USER_NAME: github
      SPARK_LOCAL_IP: 0.0.0.0
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      spark-cache-init:
        condition: service_completed_successfully
    entrypoint: [/opt/spark/bin/spark-submit]
    command:
      - --master
      - local[2]
      - --driver-memory
      - 768m
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.jars.ivySettings=/opt/project/storage/ivysettings.xml
      - --conf
      - spark.driver.host=spark-silver
      - --py-files
      - /opt/project/storage/silver_contract.py,/opt/project/storage/hudi_io.py
      - --packages
      - ${SPARK_HUDI_PACKAGE:-org.apache.hudi:hudi-spark3.5-bundle_2.12:0.15.0}
      - /opt/project/storage/silver_job.py
    volumes:
      - ./storage:/opt/project/storage:ro
      - ./analytics:/opt/project/analytics:ro
      - spark-ivy:/tmp/ivy
    mem_limit: 1536m

  producer:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: il05-python:0.1.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: github_events
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    command: [python, -m, ingestion.producer, --input, data/samples/github_events.jsonl, --interval, "0.25"]
    mem_limit: 192m

  part4-init:
    profiles: [part4]
    image: python:3.11-slim-bookworm
    entrypoint: [python, /opt/il05/init_secrets.py]
    volumes:
      - ./orchestration/init_secrets.py:/opt/il05/init_secrets.py:ro
      - part4-secrets:/secrets
      - pipeline-runtime:/runtime
    mem_limit: 128m

  serving-db:
    profiles: [part4]
    image: postgres:16
    environment:
      POSTGRES_USER: il05
      POSTGRES_DB: il05
      POSTGRES_PASSWORD_FILE: /run/il05-secrets/postgres_password
    depends_on:
      part4-init:
        condition: service_completed_successfully
    volumes:
      - serving-postgres:/var/lib/postgresql/data
      - part4-secrets:/run/il05-secrets:ro
      - ./orchestration/postgres_init.sh:/docker-entrypoint-initdb.d/01-il05.sh:ro
      - ./orchestration/databases.sql:/opt/il05/databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U il05 -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m

  pipeline-runner:
    profiles: [part4]
    image: il05-runner:0.2.0
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    environment:
      PROJECT_ROOT: /opt/project
      PIPELINE_RUNTIME: /opt/project/data/runtime
      PYTHONPATH: /opt/project
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: github_events
      WEBHDFS_URL: http://namenode:9870
      HADOOP_USER_NAME: github
      HUDI_PACKAGE: org.apache.hudi:hudi-spark3.5-bundle_2.12:0.15.0
    depends_on:
      serving-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      hdfs-init:
        condition: service_completed_successfully
      spark-cache-init:
        condition: service_completed_successfully
    volumes:
      - ./orchestration:/opt/project/orchestration:ro
      - ./dashboard:/opt/project/dashboard:ro
      - ./ingestion:/opt/project/ingestion:ro
      - ./storage:/opt/project/storage:ro
      - ./analytics:/opt/project/analytics:ro
      - ./data/samples:/opt/project/data/samples:ro
      - pipeline-runtime:/opt/project/data/runtime
      - spark-ivy:/tmp/ivy
      - part4-secrets:/run/il05-secrets:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 18
    mem_limit: 1536m

  airflow:
    profiles: [part4]
    image: apache/airflow:3.4.0-python3.11
    user: "50000:0"
    command: [bash, /opt/project/orchestration/start_airflow.sh]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-18082}:8080"
    environment:
      PYTHONPATH: /opt/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/orchestration/dags
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: student:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/project/orchestration/connection_uri.py airflow
      AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/il05-secrets/airflow_fernet_key
      AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/il05-secrets/airflow_jwt_secret
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow:8080/execution/
      PIPELINE_RUNNER_URL: http://pipeline-runner:8090
    depends_on:
      pipeline-runner:
        condition: service_healthy
    volumes:
      - airflow-home:/opt/airflow
      - ./orchestration:/opt/project/orchestration:ro
      - part4-secrets:/run/il05-secrets:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 2048m

  superset:
    profiles: [part4]
    image: il05-superset:0.2.0
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    entrypoint: [bash, /opt/project/dashboard/start_superset.sh]
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    environment:
      PYTHONPATH: /opt/project
      SUPERSET_CONFIG_PATH: /opt/project/dashboard/superset_config.py
      FLASK_APP: superset.app:create_app()
    depends_on:
      pipeline-runner:
        condition: service_healthy
    volumes:
      - superset-home:/app/superset_home
      - ./dashboard:/opt/project/dashboard:ro
      - ./orchestration:/opt/project/orchestration:ro
      - part4-secrets:/run/il05-secrets:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 1024m

volumes:
  kafka-data:
  hdfs-name:
  hdfs-data:
  spark-ivy:
  part4-secrets:
  pipeline-runtime:
  serving-postgres:
  airflow-home:
  superset-home:
