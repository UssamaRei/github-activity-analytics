name: Starter checks
on: [push, pull_request]

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m ingestion.producer --input data/samples/github_events.jsonl --dry-run
      - run: docker compose config --quiet
      - run: docker compose --profile part4 config --quiet
